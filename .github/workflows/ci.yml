name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sqlite:
    name: Checks + e2e (SQLite, devenv)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile install nixpkgs#devenv
      # Same single command as local: install, migrate + seed SQLite, vp run ci
      # (format, lint, types, template types, unit tests, build, e2e).
      - name: devenv test
        run: devenv test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-sqlite
          path: test-results/
          retention-days: 7

  postgres:
    name: Build + e2e (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sic
          POSTGRES_PASSWORD: sic
          POSTGRES_DB: sic_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sic -d sic_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Selects the PostgreSQL provider for schema rendering, client generation, build and e2e.
      DATABASE_URL: postgresql://sic:sic@localhost:5432/sic_e2e
      E2E_DATABASE_URL: postgresql://sic:sic@localhost:5432/sic_e2e
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install (renders the PostgreSQL schema and generates the client)
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        run: pnpm exec astro build
      - name: e2e against PostgreSQL
        run: pnpm exec playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-postgres
          path: test-results/
          retention-days: 7

  mariadb:
    name: Build + e2e (MariaDB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_USER: sic
          MARIADB_PASSWORD: sic
          MARIADB_DATABASE: sic_e2e
          MARIADB_ROOT_PASSWORD: ci-root
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Selects the MySQL provider for schema rendering, client generation, build and e2e.
      DATABASE_URL: mysql://sic:sic@127.0.0.1:3306/sic_e2e
      E2E_DATABASE_URL: mysql://sic:sic@127.0.0.1:3306/sic_e2e
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install (renders the MySQL schema and generates the client)
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        run: pnpm exec astro build
      - name: e2e against MariaDB
        run: pnpm exec playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-mariadb
          path: test-results/
          retention-days: 7
